name: Weekly workforce research

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Research scope
        required: true
        type: choice
        options:
          - manufacturing
          - other_industries
          - all_industries
        default: all_industries
      country_searched:
        description: Optional country filter (leave blank for global research)
        required: false
        type: string
      max_sources_per_industry:
        description: Recommended discovery results per query (8)
        required: true
        type: number
        default: 8

concurrency:
  group: weekly-workforce-research
  cancel-in-progress: false

# Each job declares only the permissions it needs.
jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests before research
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  weekly-research:
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run research and update the persistent Google Sheet
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_MODE: ${{ inputs.mode }}
          SOURCE_LIMIT: ${{ inputs.max_sources_per_industry }}
          COUNTRY_SEARCHED: ${{ inputs.country_searched }}
        run: |
          for SECRET_NAME in TAVILY_API_KEY GEMINI_API_KEY GOOGLE_SHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "Repository secret $SECRET_NAME must be configured." >&2
              exit 1
            fi
          done
          MODE="${RESEARCH_MODE:-all_industries}"
          LIMIT="${SOURCE_LIMIT:-8}"
          COUNTRY="${COUNTRY_SEARCHED:-}"
          COUNTRY_ARGS=()
          if [ -n "$COUNTRY" ]; then COUNTRY_ARGS=(--country-searched "$COUNTRY"); fi
          PYTHONPATH=src python main.py --mode "$MODE" --max-sources-per-industry "$LIMIT" "${COUNTRY_ARGS[@]}" --output-dir research_output --history-path data/findings_history.jsonl --source-history-path data/source_history.jsonl --publish-google-sheets
      - name: Validate generated history files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("data/findings_history.jsonl"), Path("data/source_history.jsonl")):
              if not path.exists():
                  raise SystemExit(f"Missing history file: {path}")
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f"{path}:{line_no}: invalid JSON: {exc}") from exc
                  if not isinstance(record, dict):
                      raise SystemExit(f"{path}:{line_no}: record must be a JSON object")
          PY
      - name: Run regression tests against generated history
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Publish updated research history to a reviewable branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/weekly-research-history"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/findings_history.jsonl data/source_history.jsonl
          if git diff --cached --quiet; then
            echo "No research-history changes; skipping PR update."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update workforce research history"
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          credential_helper="$RUNNER_TEMP/git-credential-helper.sh"
          cat > "$credential_helper" <<'EOF'
          #!/bin/sh
          if [ "$1" = "get" ]; then
              printf 'username=x-access-token\npassword=%s\n\n' "$GH_TOKEN"
          fi
          EOF
          chmod 700 "$credential_helper"
          trap 'rm -f "$credential_helper"' EXIT
          if [ -n "$remote_sha" ]; then
            GIT_TERMINAL_PROMPT=0 git -c credential.helper="$credential_helper" push origin "HEAD:refs/heads/${BRANCH}" --force-with-lease="refs/heads/${BRANCH}:${remote_sha}"
          else
            GIT_TERMINAL_PROMPT=0 git -c credential.helper="$credential_helper" push origin "HEAD:refs/heads/${BRANCH}"
          fi
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Updated the existing research-history PR branch."
          else
            body="$(cat <<EOF
            Automated public-source research history update.

            Both JSONL files were validated and the full regression suite was run before and after generation. This workflow publishes to a reviewable branch only; it never pushes history directly to main.

            GitHub suppresses PR-triggered workflows for PRs created with GITHUB_TOKEN, so tests are verified within this run.

            Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            EOF
            )"
            gh pr create --draft --base main --head "$BRANCH" --title "Update weekly workforce research history" --body "$body"
          fi
