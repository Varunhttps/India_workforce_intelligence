name: Weekly workforce research

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Research scope
        required: true
        type: choice
        options:
          - manufacturing
          - other_industries
          - all_industries
        default: all_industries
      country_searched:
        description: Optional country filter (leave blank for global research)
        required: false
        type: string
      max_sources_per_industry:
        description: Recommended discovery results per query (8)
        required: true
        type: number
        default: 8

permissions:
  contents: write

concurrency:
  group: weekly-workforce-research
  cancel-in-progress: false

jobs:
  weekly-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run research and update the persistent Google Sheet
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEARCH_MODE: ${{ inputs.mode }}
          SOURCE_LIMIT: ${{ inputs.max_sources_per_industry }}
          COUNTRY_SEARCHED: ${{ inputs.country_searched }}
        run: |
          for SECRET_NAME in TAVILY_API_KEY GEMINI_API_KEY GOOGLE_SHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "Repository secret $SECRET_NAME must be configured." >&2
              exit 1
            fi
          done
          MODE="${RESEARCH_MODE:-all_industries}"
          LIMIT="${SOURCE_LIMIT:-8}"
          COUNTRY="${COUNTRY_SEARCHED:-}"
          COUNTRY_ARGS=()
          if [ -n "$COUNTRY" ]; then COUNTRY_ARGS=(--country-searched "$COUNTRY"); fi
          PYTHONPATH=src python main.py --mode "$MODE" --max-sources-per-industry "$LIMIT" "${COUNTRY_ARGS[@]}" --output-dir research_output --history-path data/findings_history.jsonl --publish-google-sheets
      - name: Commit updated public-source research history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/findings_history.jsonl
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update workforce research history"
            git push origin HEAD:main
          fi
