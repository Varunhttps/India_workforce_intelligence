name: Python tests
on:
  pull_request:
  push:
    branches: [main, global-manufacturing-refactor]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt beautifulsoup4 pymupdf trafilatura
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
